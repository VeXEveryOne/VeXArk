name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Require Android signing secrets
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.VEXARK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VEXARK_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.VEXARK_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEYSTORE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:KEYSTORE_PASSWORD) -or
              [string]::IsNullOrWhiteSpace($env:KEY_PASSWORD)) {
            throw "VeXArk Android signing secrets are not configured."
          }
          [IO.File]::WriteAllBytes(
            "$env:RUNNER_TEMP\vexark-release.jks",
            [Convert]::FromBase64String($env:KEYSTORE_BASE64))

      - name: Install Android NDK
        shell: pwsh
        run: sdkmanager "ndk;29.0.14206865"

      - name: Build and test
        shell: pwsh
        env:
          VEXARK_KEYSTORE_PATH: ${{ runner.temp }}\vexark-release.jks
          VEXARK_KEYSTORE_PASSWORD: ${{ secrets.VEXARK_KEYSTORE_PASSWORD }}
          VEXARK_KEY_ALIAS: vexark
          VEXARK_KEY_PASSWORD: ${{ secrets.VEXARK_KEY_PASSWORD }}
        run: .\scripts\build.ps1 -Configuration Release

      - name: Prepare release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts\release | Out-Null
          Copy-Item artifacts\publish\VeXArk.exe artifacts\release\VeXArk.exe
          Copy-Item agent\app\build\outputs\apk\release\app-release.apk `
            artifacts\release\VeXArk-Agent.apk
          $files = Get-ChildItem artifacts\release -File | Sort-Object Name
          $lines = $files | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          Set-Content artifacts\release\SHA256SUMS.txt $lines -Encoding ascii

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/release/VeXArk.exe
            artifacts/release/VeXArk-Agent.apk
            artifacts/release/SHA256SUMS.txt
