name: Bug report
description: Report a reproducible VeXArk problem
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, recovery phrases, tokens or personal backup data.
        Security vulnerabilities must use private vulnerability reporting.
  - type: input
    id: version
    attributes:
      label: VeXArk version
      placeholder: 0.6.1
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Windows desktop
        - Android Agent
        - Backup repository
        - Restore
        - Root helper
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows, phone model, Android/ROM and root provider where relevant.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
