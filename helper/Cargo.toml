[package]
name = "phonebackup-helper"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
base64 = "0.22"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
